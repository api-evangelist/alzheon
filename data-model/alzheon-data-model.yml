metadata_entities:
- name: Type
  route: /wp/v2/types
  operation: listTypes
  description: Registered post types and their REST base paths.
- name: Taxonomy
  route: /wp/v2/taxonomies
  operation: listTaxonomies
  description: Registered taxonomies and the post types they apply to.
- name: Status
  route: /wp/v2/statuses
  operation: listStatuses
  description: Registered post statuses.
relationship_traversal:
  mechanism: _links + _embed
  detail: >-
    Every object carries a _links map (self, collection, author, replies, wp:featuredmedia,
    wp:attachment, wp:term). Appending _embed to a request inlines those linked objects under
    _embedded, which resolves author, featured media and terms in a single round trip instead
    of one call per relationship.
