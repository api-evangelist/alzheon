source: >-
  openapi/alzheon-content-openapi.yml and the live route index / sample payloads observed
  at https://alzheon.com/wp-json on 2026-07-31
note: >-
  Entity graph of the WordPress content model as this site actually exposes it. Relationships
  were derived from the id-reference fields present in real responses (author, categories,
  tags, featured_media, parent, post) and from the taxonomy registration returned by
  /wp/v2/taxonomies — not from a published object reference, because Alzheon publishes none.
id_scheme:
  type: integer
  prefixed: false
  detail: >-
    All objects use bare auto-increment integers, unique within a post type or taxonomy
    rather than globally. There are no typed id prefixes, so an id alone does not identify
    its entity — always carry the collection with it.
entities:
- name: Post
  route: /wp/v2/posts
  operations: [listPosts, getPost]
  count_observed: 224
  description: >-
    Press releases and in-the-news items. This is the substantive content of the site: the
    company's dated announcements about ALZ-801 / valiltramiprosate trials, financings,
    conference presentations and board appointments.
  key_fields: [id, date, date_gmt, modified, modified_gmt, slug, status, link, title,
    content, excerpt, author, featured_media, categories, tags, format, meta, _links]
  relationships:
  - {type: belongs_to, target: User, via: author}
  - {type: has_one, target: Media, via: featured_media}
  - {type: has_many, target: Category, via: categories}
  - {type: has_many, target: Tag, via: tags}
  - {type: has_many, target: Comment, via: 'Comment.post'}
- name: Page
  route: /wp/v2/pages
  operations: [listPages, getPage]
  count_observed: 25
  description: >-
    Static site pages — science, mechanism of action, pipeline, publications, posters,
    people (management, board, scientific advisory board), patients, careers, contact,
    privacy policy.
  key_fields: [id, date, slug, status, link, title, content, excerpt, author, featured_media,
    parent, menu_order, template, meta, _links]
  relationships:
  - {type: belongs_to, target: User, via: author}
  - {type: has_one, target: Media, via: featured_media}
  - {type: belongs_to, target: Page, via: parent, note: pages nest (e.g. science/pipeline)}
- name: Media
  route: /wp/v2/media
  operations: [listMedia, getMedia]
  count_observed: 624
  description: >-
    The media library: logos, team headshots, conference posters and publication assets.
  key_fields: [id, date, slug, link, title, author, media_type, mime_type, source_url,
    media_details, alt_text, post, _links]
  relationships:
  - {type: belongs_to, target: User, via: author}
  - {type: belongs_to, target: Post, via: post, note: the object the file was uploaded to}
