generated: '2026-07-31'
method: derived
source: >-
  openapi/alzheon-content-openapi.yml, the live route index at https://alzheon.com/wp-json/,
  and probes of status./trust. subdomains and common policy paths on 2026-07-31
note: >-
  Alzheon runs no developer programme, so there is no versioning policy, no deprecation
  policy, no SLA and no status page to find. Every field below records a probed absence
  rather than an assumed one. No StatusPage or Deprecation pointer is wired in apis.yml,
  because neither exists — recording the absence is the honest result.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  policy_url: null
  policy_published: false
  detail: >-
    The version is the WordPress core REST namespace, not a version Alzheon controls or
    publishes a policy for. It changes when WordPress core changes. Plugin namespaces on
    the same install (yoast/v1, google-site-kit/v1, contact-form-7/v1, cf7apps/v1,
    wpe/cache-plugin/v1, post-duplicator/v1, awb) version independently and can appear or
    disappear when the site's plugins are updated. Treat the whole surface as unversioned
    from a consumer's point of view.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    No Sunset or Deprecation response header was observed and no deprecation policy is
    published. Routes can be removed without notice when a plugin is deactivated.
deprecated_operations: []
sla:
  url: null
  uptime_target: null
  published: false
