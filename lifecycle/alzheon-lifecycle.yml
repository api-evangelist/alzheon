retirement_risk:
  level: high
  reasons:
  - The API can be disabled entirely by a single WordPress setting or security plugin.
  - Plugin namespaces appear and disappear with site maintenance.
  - No notice mechanism exists (no Sunset header, no changelog, no status page).
