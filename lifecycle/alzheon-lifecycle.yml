changelog:
  api_changelog_url: null
  published: false
  company_announcements: https://alzheon.com/media/press-releases/
  detail: >-
    Alzheon publishes dated corporate press releases (224 posts, most recent 2026-07-06 at
    the time of probing) but no API changelog. The press-release feed is a company
    changelog, not an API one, so no ChangeLog artifact pointer is wired.
stability:
  assessment: incidental
  detail: >-
    This is a content-management surface exposed as a side effect of running WordPress. It
    carries no compatibility commitment, and Alzheon has given no indication it is intended
    for third-party consumption. Consumers should pin nothing and re-read the route index
    at GET /wp-json/ before each run.
caching:
