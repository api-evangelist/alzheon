apis:
- name: Alzheon Content API (WordPress REST)
  description: 'Read-only, anonymously accessible WordPress REST API served by the Alzheon
    corporate site at https://alzheon.com/wp-json. It exposes the company''s press releases
    and in-the-news items (224 posts), static science / pipeline / people / patients pages
    (25), the media library (624 items), taxonomies, cross-content search and oEmbed. This
    is an incidental content management surface, not a first-party API product: Alzheon
    publishes no developer documentation, keys, SDKs, support channel or terms of use for
    it, and all administrative and write routes return 401 to anonymous callers.'
