aid: alzheon
name: Alzheon
description: 'Alzheon, Inc. is a privately held clinical-stage biopharmaceutical company
  founded in 2013 and headquartered at 111 Speen Street, Framingham, Massachusetts,
  developing oral small-molecule therapeutics and diagnostics for Alzheimer''s disease
  and other neurodegenerative disorders. Its lead candidate, valiltramiprosate (ALZ-801)
  — a valine-conjugated prodrug of tramiprosate that blocks the formation of neurotoxic
  soluble beta-amyloid oligomers — has FDA Fast Track designation and completed the
  pivotal APOLLOE4 Phase 3 trial in APOE4/4 homozygotes with early Alzheimer''s disease.
  Alzheon operates no product or developer API and publishes no developer portal, SDKs
  or API documentation; its corporate site does serve the standard WordPress REST API
  anonymously, which makes its press releases, science pages and media library machine-readable.'
