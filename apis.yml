  notes: >-
    No product API. Contract discovery probed alzheon.com and www.alzheon.com plus seven
    non-resolving subdomains for OpenAPI, GraphQL, MCP tools/list, A2A agent cards and the
    full /.well-known/ set — all 404 or NXDOMAIN. The one real machine-readable contract
    found is the site's anonymous WordPress REST API at https://alzheon.com/wp-json (15
    namespaces, 311 routes); an OpenAPI 3.1 covering 24 verified anonymous read operations
    was derived from that live route index. No packages, MCP server, agent card, OAuth
    scopes, vulnerability-disclosure programme or trust center exist; those artifacts were
    deliberately not written rather than stubbed.
